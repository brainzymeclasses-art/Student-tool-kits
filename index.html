 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manish VLC-Style Player Pro</title>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Plyr -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #0f172a;
    color: #f8fafc;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.player-container {
    width: 100%;
    max-width: 950px;
    background: #1e293b;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,.5);
}

h1 {
    text-align: center;
    font-size: 1.5rem;
    color: #38bdf8;
    margin-bottom: 20px;
}

.controls-row {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.input-group {
    flex: 1;
    min-width: 240px;
    background: #334155;
    padding: 12px;
    border-radius: 10px;
    border: 1px dashed #38bdf8;
}

.input-group label {
    display: block;
    font-size: .82rem;
    color: #cbd5e1;
    margin-bottom: 7px;
}

input[type="file"] {
    width: 100%;
    color: #cbd5e1;
    font-size: .8rem;
}

.boost-box {
    flex: 1;
    min-width: 240px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #0f172a;
    padding: 12px 15px;
    border-radius: 10px;
    border: 1px solid #334155;
}

.boost-box span {
    color: #38bdf8;
    font-size: .82rem;
    font-weight: 600;
}

#volumeBooster {
    flex: 1;
    accent-color: #38bdf8;
}

#boostVal {
    min-width: 45px;
    text-align: right;
}

.video-wrapper {
    position: relative;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    display: none;
    touch-action: manipulation;
}

#vlcPlayer {
    width: 100%;
    display: block;
}

/* Gesture zones */
.gesture-zone {
    position: absolute;
    top: 0;
    bottom: 55px;
    width: 35%;
    z-index: 5;
    pointer-events: auto;
}

.gesture-left {
    left: 0;
}

.gesture-right {
    right: 0;
}

/* Don't interfere with normal desktop mouse controls */
@media (hover: hover) and (pointer: fine) {
    .gesture-zone {
        pointer-events: none;
    }
}

/* Gesture feedback */
.gesture-feedback {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    padding: 12px 18px;
    border-radius: 30px;
    background: rgba(0,0,0,.72);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    transition: opacity .15s;
}

.gesture-feedback.show {
    opacity: 1;
}

.feedback-left {
    left: 20px;
}

.feedback-right {
    right: 20px;
}

.hold-indicator {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,.78);
    padding: 12px 20px;
    border-radius: 30px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    z-index: 21;
}

.hold-indicator.show {
    opacity: 1;
}

.shortcut-tips {
    margin-top: 15px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 8px;
    background: #0f172a;
    padding: 12px;
    border-radius: 10px;
    font-size: .72rem;
    color: #94a3b8;
    text-align: center;
}

.shortcut-tips div {
    padding: 5px;
}

.shortcut-tips span {
    background: #334155;
    color: #fff;
    padding: 3px 7px;
    border-radius: 5px;
    font-weight: 700;
}

/* Mobile */
@media (max-width: 600px) {
    body {
        padding: 10px;
        align-items: flex-start;
    }

    .player-container {
        padding: 13px;
        margin-top: 10px;
    }

    h1 {
        font-size: 1.15rem;
    }

    .controls-row {
        gap: 10px;
    }

    .input-group,
    .boost-box {
        min-width: 100%;
    }

    .shortcut-tips {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<div class="player-container">

    <h1>🎬 Manish VLC-Style Player Pro</h1>

    <div class="controls-row">

        <div class="input-group">
            <label for="videoInput">📁 Choose Video File</label>
            <input type="file" id="videoInput" accept="video/*">
        </div>

        <div class="input-group">
            <label for="subtitleInput">💬 Add Subtitles (.vtt / .srt)</label>
            <input type="file" id="subtitleInput" accept=".vtt,.srt,text/vtt,application/x-subrip">
        </div>

        <div class="boost-box">
            <span>🔊 Booster</span>
            <input type="range" id="volumeBooster" min="1" max="2" step="0.1" value="1">
            <span id="boostVal">100%</span>
        </div>

    </div>

    <div class="video-wrapper" id="videoWrapper">

        <video id="vlcPlayer" playsinline controls crossorigin="anonymous"></video>

        <div class="gesture-zone gesture-left" id="leftZone"></div>
        <div class="gesture-zone gesture-right" id="rightZone"></div>

        <div class="gesture-feedback feedback-left" id="leftFeedback"></div>
        <div class="gesture-feedback feedback-right" id="rightFeedback"></div>

        <div class="hold-indicator" id="holdIndicator">
            🚀 2× Speed
        </div>

    </div>

    <div class="shortcut-tips">
        <div><span>Space</span> Play / Pause</div>
        <div><span>←</span> Back 10s</div>
        <div><span>→</span> Forward 10s</div>
        <div><span>M</span> Mute</div>
        <div><span>F</span> Fullscreen</div>
        <div><span>Hold</span> 2× Speed</div>
    </div>

</div>

<!-- Plyr JS -->
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>
'use strict';

/* =========================================================
   PLAYER INITIALIZATION
========================================================= */

const player = new Plyr('#vlcPlayer', {
    controls: [
        'play-large',
        'play',
        'progress',
        'current-time',
        'duration',
        'mute',
        'volume',
        'captions',
        'settings',
        'pip',
        'fullscreen'
    ],

    speed: {
        selected: 1,
        options: [0.5, 1, 1.25, 1.5, 1.75, 2]
    },

    keyboard: {
        focused: true,
        global: false
    }
});


/* =========================================================
   ELEMENTS
========================================================= */

const videoInput = document.getElementById('videoInput');
const subtitleInput = document.getElementById('subtitleInput');
const videoWrapper = document.getElementById('videoWrapper');
const videoElement = document.getElementById('vlcPlayer');

const volumeBooster = document.getElementById('volumeBooster');
const boostVal = document.getElementById('boostVal');

const leftZone = document.getElementById('leftZone');
const rightZone = document.getElementById('rightZone');

const leftFeedback = document.getElementById('leftFeedback');
const rightFeedback = document.getElementById('rightFeedback');

const holdIndicator = document.getElementById('holdIndicator');


/* =========================================================
   AUDIO BOOSTER
========================================================= */

let audioCtx = null;
let sourceNode = null;
let gainNode = null;

function initAudioBooster() {

    if (audioCtx) return;

    try {

        audioCtx = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

        sourceNode = audioCtx.createMediaElementSource(videoElement);

        gainNode = audioCtx.createGain();

        sourceNode.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        gainNode.gain.value =
            parseFloat(volumeBooster.value);

    } catch (error) {

        console.warn(
            'Audio booster could not initialize:',
            error
        );
    }
}

volumeBooster.addEventListener('input', function() {

    initAudioBooster();

    if (audioCtx &&
        audioCtx.state === 'suspended') {

        audioCtx.resume();
    }

    const multiplier =
        parseFloat(this.value);

    if (gainNode) {
        gainNode.gain.value = multiplier;
    }

    boostVal.textContent =
        Math.round(multiplier * 100) + '%';
});


/* =========================================================
   VIDEO FILE LOADING
========================================================= */

let currentVideoURL = null;
let currentSubtitleURL = null;

videoInput.addEventListener('change', function(event) {

    const file = event.target.files[0];

    if (!file) return;

    if (currentVideoURL) {
        URL.revokeObjectURL(currentVideoURL);
    }

    currentVideoURL = URL.createObjectURL(file);

    videoWrapper.style.display = 'block';

    player.source = {
        type: 'video',

        sources: [{
            src: currentVideoURL,
            type: file.type || 'video/mp4'
        }]
    };

    /*
       Initialize audio after video source changes.
       Browsers require the AudioContext to be connected
       to the current media element.
    */
    setTimeout(() => {

        initAudioBooster();

        if (audioCtx &&
            audioCtx.state === 'suspended') {

            audioCtx.resume();
        }

        player.play().catch(() => {});

    }, 150);

});


/* =========================================================
   SRT → WEBVTT CONVERTER
========================================================= */

function srtToVtt(srtText) {

    let text = srtText;

    text = text.replace(/\r\n/g, '\n');
    text = text.replace(/\r/g, '\n');

    /*
       Remove SRT numbering.
    */
    text = text.replace(
        /^\d+\s*$/gm,
        ''
    );

    /*
       Convert timestamps:
       00:00:01,500
       →
       00:00:01.500
    */
    text = text.replace(
        /(\d{2}:\d{2}:\d{2}),(\d{3})/g,
        '$1.$2'
    );

    return 'WEBVTT\n\n' + text.trim();
}


/* =========================================================
   SUBTITLE LOADING
========================================================= */

subtitleInput.addEventListener('change', async function(event) {

    const file = event.target.files[0];

    if (!file) return;

    try {

        if (currentSubtitleURL) {
            URL.revokeObjectURL(currentSubtitleURL);
            currentSubtitleURL = null;
        }

        let subtitleText =
            await file.text();

        const isSRT =
            file.name.toLowerCase().endsWith('.srt');

        if (isSRT) {
            subtitleText =
                srtToVtt(subtitleText);
        }

        const subtitleBlob =
            new Blob(
                [subtitleText],
                { type: 'text/vtt' }
            );

        currentSubtitleURL =
            URL.createObjectURL(subtitleBlob);

        /*
           Remove old tracks.
        */
        videoElement
            .querySelectorAll('track')
            .forEach(track => track.remove());

        const track =
            document.createElement('track');

        track.kind = 'subtitles';
        track.label = 'Custom Subtitles';
        track.srclang = 'en';
        track.src = currentSubtitleURL;
        track.default = true;

        videoElement.appendChild(track);

        /*
           Wait for browser to register the track.
        */
        setTimeout(() => {

            try {

                player.toggleCaptions(true);

            } catch (error) {

                console.warn(
                    'Subtitle activation:',
                    error
                );
            }

        }, 100);

    } catch (error) {

        alert(
            'Unable to load this subtitle file.'
        );

        console.error(error);
    }

});


/* =========================================================
   MOBILE GESTURES
========================================================= */

let tapTimers = {
    left: null,
    right: null
};

let tapCounts = {
    left: 0,
    right: 0
};

let holdTimers = {
    left: null,
    right: null
};

let holding = {
    left: false,
    right: false
};

const TAP_WINDOW = 300;
const HOLD_TIME = 400;


/* ---------------------------------------------------------
   Feedback
--------------------------------------------------------- */

function showFeedback(element, text) {

    element.textContent = text;

    element.classList.add('show');

    setTimeout(() => {
        element.classList.remove('show');
    }, 500);
}


/* ---------------------------------------------------------
   Skip
--------------------------------------------------------- */

function skipVideo(seconds, side) {

    if (!Number.isFinite(player.currentTime)) {
        return;
    }

    if (side === 'left') {

        player.rewind(seconds);

        showFeedback(
            leftFeedback,
            '⏪ -' + seconds + 's'
        );

    } else {

        player.forward(seconds);

        showFeedback(
            rightFeedback,
            '⏩ +' + seconds + 's'
        );
    }
}


/* ---------------------------------------------------------
   Start touch
--------------------------------------------------------- */

function startTouch(side, event) {

    /*
       Only use the first finger.
    */
    if (event.touches &&
        event.touches.length > 1) {
        return;
    }

    holding[side] = false;

    clearTimeout(
        holdTimers[side]
    );

    holdTimers[side] =
        setTimeout(() => {

            holding[side] = true;

            player.speed = 2;

            holdIndicator.classList.add('show');

        }, HOLD_TIME);
}


/* ---------------------------------------------------------
   End touch
--------------------------------------------------------- */

function endTouch(side, event) {

    clearTimeout(
        holdTimers[side]
    );

    /*
       If this was a hold,
       restore normal speed and
       don't count it as a tap.
    */
    if (holding[side]) {

        player.speed = 1;

        holdIndicator.classList.remove(
            'show'
        );

        holding[side] = false;

        return;
    }

    /*
       Count taps.
    */
    tapCounts[side]++;

    clearTimeout(
        tapTimers[side]
    );

    tapTimers[side] =
        setTimeout(() => {

            const count =
                tapCounts[side];

            tapCounts[side] = 0;

            if (count === 2) {

                skipVideo(
                    10,
                    side
                );

            } else if (count >= 3) {

                skipVideo(
                    30,
                    side
                );
            }

        }, TAP_WINDOW);
}


/* ---------------------------------------------------------
   Prevent accidental browser actions
--------------------------------------------------------- */

function cancelTouch(side) {

    clearTimeout(
        holdTimers[side]
    );

    holding[side] = false;
}


/* ---------------------------------------------------------
   Event listeners
--------------------------------------------------------- */

leftZone.addEventListener(
    'touchstart',
    e => startTouch('left', e),
    { passive: true }
);

leftZone.addEventListener(
    'touchend',
    e => endTouch('left', e),
    { passive: true }
);

leftZone.addEventListener(
    'touchcancel',
    () => cancelTouch('left')
);

rightZone.addEventListener(
    'touchstart',
    e => startTouch('right', e),
    { passive: true }
);

rightZone.addEventListener(
    'touchend',
    e => endTouch('right', e),
    { passive: true }
);

rightZone.addEventListener(
    'touchcancel',
    () => cancelTouch('right')
);


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    'keydown',
    function(event) {

        const tag =
            document.activeElement.tagName;

        /*
           Don't hijack typing/file inputs.
        */
        if (
            tag === 'INPUT' ||
            tag === 'TEXTAREA' ||
            tag === 'SELECT'
        ) {
            return;
        }

        switch(event.code) {

            case 'Space':

                event.preventDefault();

                player.togglePlay();

                break;


            case 'ArrowRight':

                event.preventDefault();

                player.forward(10);

                break;


            case 'ArrowLeft':

                event.preventDefault();

                player.rewind(10);

                break;


            case 'KeyM':

                player.muted =
                    !player.muted;

                break;


            case 'KeyF':

                player.fullscreen.toggle();

                break;
        }

    }
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    'beforeunload',
    function() {

        if (currentVideoURL) {
            URL.revokeObjectURL(
                currentVideoURL
            );
        }

        if (currentSubtitleURL) {
            URL.revokeObjectURL(
                currentSubtitleURL
            );
        }

        if (audioCtx) {

            audioCtx.close()
                .catch(() => {});

        }
    }
);

</script>

</body>
</html>
